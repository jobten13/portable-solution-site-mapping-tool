<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Field Site Planner - Precision Scale</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

    <style>
        :root { --primary: #2c3e50; --accent: #3498db; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; }
        #sidebar { width: 320px; background: #fff; border-right: 1px solid #ddd; padding: 20px; z-index: 1000; overflow-y: auto; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
        #map { flex-grow: 1; height: 100%; z-index: 1; background: #eee; }
        
        .search-container { margin-bottom: 20px; display: flex; gap: 5px; }
        #addrInput { flex-grow: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        
        h2 { font-size: 1.2rem; color: var(--primary); margin: 0 0 10px 0; border-bottom: 2px solid var(--accent); padding-bottom: 8px; }
        .mfg-label { font-weight: bold; font-size: 0.7rem; color: #888; text-transform: uppercase; margin: 15px 0 5px; display: block; }
        
        button { width: 100%; background: #f9f9f9; border: 1px solid #ddd; padding: 10px; text-align: left; border-radius: 6px; cursor: pointer; font-size: 0.85rem; margin-bottom: 5px; transition: 0.2s; }
        button:hover { background: #eff6ff; border-color: var(--accent); }
        
        .active-controls { margin-top: 20px; padding: 15px; background: #f0f7ff; border-radius: 8px; border: 1px solid #b3d7ff; display: none; }
        .delete-btn { background: #ffeded; color: #cc0000; border: 1px solid #ffcccc; margin-top: 15px; text-align: center; }
        
        input[type=range] { width: 100%; cursor: pointer; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Site Planner</h2>
    <div class="search-container">
        <input type="text" id="addrInput" placeholder="Address or Lat, Lon">
        <button style="width:auto;" onclick="searchLocation()">Go</button>
    </div>

    <span class="mfg-label">Blu-Med</span>
    <button onclick="spawnTent(20, 32.5, 'BluMed 2032.5', '#27ae60')">XP 2032.5 (20x32.5')</button>
    <button onclick="spawnTent(20, 39, 'BluMed 2039', '#219150')">XP 2039 (20x39')</button>
    <button onclick="spawnTent(8, 8, 'BluMed Vestibule', '#16a085')">Vestibule (8x8')</button>
    
    <span class="mfg-label">Western Shelter</span>
    <button onclick="spawnTent(18.58, 33.92, 'WS 1935', '#e67e22')">GK 1935 (18.6x33.9')</button>
    <button onclick="spawnTent(18.58, 18.58, 'WS 20', '#d35400')">GK 20 (18.6x18.6')</button>
    <button onclick="spawnTent(7.67, 7.33, 'WS Vestibule', '#e74c3c')">Vestibule (7.7x7.3')</button>

    <div id="controls" class="active-controls">
        <strong>Selected: <span id="activeName">None</span></strong><br>
        <small style="color:#666;">Drag center circle to move</small>
        <div style="margin-top:10px;">
            <label>Rotate: <span id="rotLabel">0</span>°</label>
            <input type="range" id="rotSlider" min="0" max="360" value="0" oninput="updateActiveTent('rotate', this.value)">
        </div>
        <button class="delete-btn" onclick="updateActiveTent('delete')">Delete Object</button>
    </div>
</div>

<div id="map"></div>

<script>
    // 1. Initialize Map with Satellite View and Imperial Scale Bar
    const map = L.map('map').setView([39.8, -98.5], 4);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri' }).addTo(map);
    L.control.scale({ imperial: true, metric: false }).addTo(map);

    let activeId = null;
    let tentData = {};

    async function searchLocation() {
        const query = document.getElementById('addrInput').value;
        if(!query) return;
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
        const data = await response.json();
        if (data.length > 0) map.flyTo([data[0].lat, data[0].lon], 20);
    }

    function spawnTent(wFt, lFt, name, color) {
        const center = map.getCenter();
        const id = 't' + Date.now();
        
        // Draggable center handle
        const dragHandle = L.circleMarker(center, {
            radius: 6, color: '#fff', weight: 2, fillColor: '#333', fillOpacity: 0.9, draggable: true
        }).addTo(map);

        tentData[id] = {
            name: name,
            widthKm: wFt * 0.0003048,
            lengthKm: lFt * 0.0003048,
            coords: [center.lng, center.lat],
            rotation: 0,
            color: color,
            handle: dragHandle
        };

        // Dragging Logic
        dragHandle.on('mousedown', () => {
            const onMove = (e) => {
                const newPos = map.mouseEventToLatLng(e.originalEvent);
                dragHandle.setLatLng(newPos);
                tentData[id].coords = [newPos.lng, newPos.lat];
                renderTent(id);
            };
            map.on('mousemove', onMove);
            map.once('mouseup', () => map.off('mousemove', onMove));
        });

        dragHandle.on('click', (e) => { L.DomEvent.stopPropagation(e); selectTent(id); });
        renderTent(id);
        selectTent(id);
    }

    function renderTent(id) {
        const d = tentData[id];
        const pt = turf.point(d.coords);
        
        // Use Turf to create a physically-accurate box
        let poly = turf.envelope(turf.featureCollection([
            turf.destination(pt, d.widthKm/2, 90, {units:'kilometers'}),
            turf.destination(pt, d.widthKm/2, -90, {units:'kilometers'}),
            turf.destination(pt, d.lengthKm/2, 0, {units:'kilometers'}),
            turf.destination(pt, d.lengthKm/2, 180, {units:'kilometers'})
        ]));

        if (d.rotation !== 0) {
            poly = turf.transformRotate(poly, d.rotation, {pivot: d.coords});
        }

        if (d.layer) map.removeLayer(d.layer);
        
        d.layer = L.geoJSON(poly, { 
            style: { color: '#fff', weight: 1, fillColor: d.color, fillOpacity: 0.7 } 
        }).addTo(map);
        
        d.layer.on('click', (e) => { L.DomEvent.stopPropagation(e); selectTent(id); });
    }

    function selectTent(id) {
        activeId = id;
        const d = tentData[id];
        document.getElementById('controls').style.display = 'block';
        document.getElementById('activeName').innerText = d.name;
        document.getElementById('rotSlider').value = d.rotation;
        document.getElementById('rotLabel').innerText = d.rotation;
    }

    function updateActiveTent(action, val) {
        if (!activeId) return;
        if (action === 'rotate') {
            tentData[activeId].rotation = parseInt(val);
            document.getElementById('rotLabel').innerText = val;
            renderTent(activeId);
        } else if (action === 'delete') {
            map.removeLayer(tentData[activeId].layer);
            map.removeLayer(tentData[activeId].handle);
            delete tentData[activeId];
            document.getElementById('controls').style.display = 'none';
            activeId = null;
        }
    }

    // Deselect when clicking empty map
    map.on('click', () => {
        document.getElementById('controls').style.display = 'none';
        activeId = null;
    });
</script>
</body>
</html>
